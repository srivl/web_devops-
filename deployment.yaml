apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  namespace: deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: srivl/webapp-devops:jenkins
        ports:
        - containerPort: 80